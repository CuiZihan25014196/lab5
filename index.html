<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalogue</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #2d3748; text-align: center; margin-bottom: 30px; }
        .book-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px 25px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #3182ce;
        }
        .book-title { font-size: 1.15em; font-weight: bold; color: #2d3748; margin-bottom: 5px; }
        .book-author { color: #718096; margin-bottom: 8px; }
        .book-price { color: #e53e3e; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Book Catalogue</h1>
        <div id="bookList"></div>
    </div>

    <script>
        fetch('book.xml')
            .then(response => {
                if (!response.ok)
                    throw new Error('Fetch error: ' + response.status)
                else
                    return response.text();
            })
            .then(xmlText => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                const books = xmlDoc.getElementsByTagName('book');
                let htmlContent = '';

                for (let i = 0; i < books.length; i++) {
                    const book = books[i];
                    const title = book.getElementsByTagName('title')[0].textContent;
                    const author = book.getElementsByTagName('author')[0].textContent;
                    const price = book.getElementsByTagName('price')[0].textContent;

                    htmlContent += `
                        <div class="book-card">
                            <div class="book-title">${title}</div>
                            <div class="book-author">Author: ${author}</div>
                            <div class="book-price">$${price}</div>
                        </div>
                    `;
                }

                document.getElementById('bookList').innerHTML = htmlContent;
            })
            .catch(err => console.error('Fetch error: ' + err.message));
    </script>
</body>
</html>
